name: Merge Gate

# Runs on every push and pull request to main, and on demand. One job per
# operating system: the suite is expected to work on Linux, macOS and Windows.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      # Let every OS finish so one platform failure does not hide another.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.12']

    defaults:
      run:
        # bash on every runner (Git Bash on Windows) so the steps below are
        # written once.
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install poetry
        # pipx is preinstalled on all three runner images.
        run: pipx install poetry

      - name: Print Python Version
        run: python -c "import sys; print(sys.version)"

      - name: Configure Git Store
        run: git config --global credential.helper store

      - name: Set the Github Token
        run: echo "https://git:${{ secrets.CCAI_ACCESS_TOKEN }}@github.com" > ~/.git-credentials

      - name: Re-Home the Repository
        run: |
          python ./repository-setup/rehome-repository
          cat ./.env

      - name: Configure the package index credential
        run: poetry config http-basic.codecraftai deployment "${{ secrets.CCAI_ORG_READ_TOKEN }}"

      - name: Lint - exception-handling gate
        # A bare `except:` swallows ConfigurationError and SemanticError, which
        # derive from BaseException so that they end a run. See
        # userguide/10-00-coding-standards.rst, exception-handling rules 5-7.
        # pipx run avoids installing into the runner's system python (PEP 668).
        run: pipx run ruff check --select E722 .

      - name: Setup the Virtual Environment
        run: |
          python ./development/setup-environment
          poetry install --all-extras

      - name: Run Tests
        run: |
          # Activate the in-project venv (bin/ on POSIX, Scripts/ on Windows) and
          # load the development environment file that rehome-repository wrote.
          source ./.venv/bin/activate 2>/dev/null || source ./.venv/Scripts/activate
          set -a; . ./.env; set +a
          python -m unittest discover -s ./source/tests -p "test_*.py"
